<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Weather Dashboard</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-400 to-indigo-600 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl w-full max-w-md p-6 text-gray-800">
        
        <!-- Search Bar -->
        <div class="flex items-center gap-2 mb-6">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
            >
            <button 
                onclick="getWeather()" 
                class="bg-indigo-600 text-white px-5 py-3 rounded-xl hover:bg-indigo-700 transition font-medium text-sm shadow-md"
            >
                Search
            </button>
        </div>

        <!-- Weather Display Section -->
        <div id="weatherDisplay" class="text-center">
            <!-- Location & Date -->
            <h2 id="cityName" class="text-2xl font-bold text-gray-900">New York</h2>
            <p id="date" class="text-sm text-gray-500 mb-4">Thursday, Oct 15, 2026</p>

            <!-- Current Temp & Icon -->
            <div class="flex items-center justify-center gap-4 my-6">
                <span id="weatherIcon" class="text-6xl">⛅</span>
                <div>
                    <h1 id="temp" class="text-5xl font-extrabold text-gray-900">22°C</h1>
                    <p id="condition" class="text-indigo-600 font-medium capitalize mt-1">Partly Cloudy</p>
                </div>
            </div>

            <!-- Weather Details Grid -->
            <div class="grid grid-cols-2 gap-4 mt-6 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                <div class="text-center">
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Humidity</p>
                    <p id="humidity" class="text-lg font-bold text-gray-700 mt-1">45%</p>
                </div>
                <div class="text-center">
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Wind Speed</p>
                    <p id="wind" class="text-lg font-bold text-gray-700 mt-1">12 km/h</p>
                </div>
            </div>
        </div>

        <!-- Error Message (Hidden by default) -->
        <p id="errorMsg" class="text-red-500 text-center text-sm mt-4 hidden">City not found. Please try again.</p>
    </div>

    <script>
        // Placeholder function: Replace this logic with a fetch call to a real Weather API (e.g., OpenWeatherMap)
        function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!city) {
                alert('Please enter a city name.');
                return;
            }

            // Simulating a successful response for demonstration purposes
            // To integrate real data, use: fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=YOUR_API_KEY`)
            
            try {
                // Dummy data update to show how elements interact
                document.getElementById('cityName').innerText = city.charAt(0).toUpperCase() + city.slice(1);
                document.getElementById('temp').innerText = Math.floor(Math.random() * (30 - 15) + 15) + '°C';
                document.getElementById('condition').innerText = 'Sunny & Clear';
                document.getElementById('weatherIcon').innerText = '☀️';
                document.getElementById('humidity').innerText = Math.floor(Math.random() * (70 - 30) + 30) + '%';
                document.getElementById('wind').innerText = Math.floor(Math.random() * (20 - 5) + 5) + ' km/h';
                errorMsg.classList.add('hidden');
            } catch (error) {
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
